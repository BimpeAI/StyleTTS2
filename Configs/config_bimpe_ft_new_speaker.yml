# Continue finetune on a NEW speaker only (prioritize her voice).
# Starts from Models/BimpeTTS_ft/best_2nd.pth — do NOT reload LibriTTS.
# Do NOT mix Bimpe training data; Bimpe identity will weaken by design.
# Prep data first — see docs/NEW_SPEAKER_FINETUNE.md

log_dir: "Models/BimpeTTS_ft_new"
save_freq: 10 # checkpoint / early-stop decision every N epochs
early_stopping_patience: 2 # stop after 2 eval intervals with no val improvement
early_stopping_min_delta: 0.0
log_interval: 10
device: "cuda"
epochs: 50 # max ceiling; early stopping can finish sooner
batch_size: 4 # drop to 2 if OOM
max_len: 300 # raise if clips are longer; drop to 200 if OOM
pretrained_model: "Models/BimpeTTS_ft/best_2nd.pth"
second_stage_load_pretrained: true
load_only_params: true
num_workers: 0

F0_path: "Utils/JDC/bst.t7"
ASR_config: "Utils/ASR/config.yml"
ASR_path: "Utils/ASR/epoch_00080.pth"
PLBERT_dir: "Utils/PLBERT/"

data_params:
  train_data: "/root/NewSpeaker_Data/train_list.txt"
  val_data: "/root/NewSpeaker_Data/val_list.txt"
  root_path: "/root/NewSpeaker_Dataset/wavs"
  OOD_data: "/root/NewSpeaker_Data/OOD_texts.txt"
  min_length: 50

preprocess_params:
  sr: 24000
  spect_params:
    n_fft: 2048
    win_length: 1200
    hop_length: 300

model_params:
  # Keep true to match LibriTTS / BimpeTTS_ft checkpoint architecture
  multispeaker: true

  dim_in: 64
  hidden_dim: 512
  max_conv_dim: 512
  n_layer: 3
  n_mels: 80

  n_token: 178
  max_dur: 50
  style_dim: 128
  dropout: 0.2

  decoder:
    type: "hifigan"
    resblock_kernel_sizes: [3, 7, 11]
    upsample_rates: [10, 5, 3, 2]
    upsample_initial_channel: 512
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
    upsample_kernel_sizes: [20, 10, 6, 4]

  slm:
    model: "microsoft/wavlm-base-plus"
    sr: 16000
    hidden: 768
    nlayers: 13
    initial_channel: 64

  diffusion:
    embedding_mask_proba: 0.1
    transformer:
      num_layers: 3
      num_heads: 8
      head_features: 64
      multiplier: 2
    dist:
      sigma_data: 0.2
      estimate_sigma_data: true
      mean: -3.0
      std: 1.0

loss_params:
  lambda_mel: 5.
  lambda_gen: 1.
  lambda_slm: 1.
  lambda_mono: 1.
  lambda_s2s: 1.
  lambda_F0: 1.
  lambda_norm: 1.
  lambda_dur: 1.
  lambda_ce: 20.
  lambda_sty: 2. # stronger style reconstruction for new-speaker identity
  lambda_diff: 1.

  # With load_only_params=true, training epoch counter restarts at 0.
  # Keep these early so diffusion + joint losses stay active while continuing.
  diff_epoch: 0
  joint_epoch: 0

optimizer_params:
  # Mild LRs for continued finetune
  lr: 0.00005
  bert_lr: 0.000005
  ft_lr: 0.00005

slmadv_params:
  min_len: 400
  max_len: 500
  batch_percentage: 0.5
  iter: 10
  thresh: 5
  scale: 0.01
  sig: 1.5
