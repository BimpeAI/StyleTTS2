log_dir: "Models/BimpeTTS"
first_stage_path: "first_stage.pth"
save_freq: 10 # checkpoint / early-stop decision every N epochs
early_stopping_patience: 2 # stop after this many save intervals with no val improvement
early_stopping_min_delta: 0.0
log_interval: 10
device: "cuda"
epochs_1st: 200 # number of epochs for first stage training (pre-training)
epochs_2nd: 100 # second stage (style diffusion + SLM); train_second.py uses this
epochs: 100
batch_size: 4 # stage 2 on small data; raise to 8 if VRAM allows and loss is stable
max_len: 200 # shorter clips train more stably on small datasets
pretrained_model: ""
second_stage_load_pretrained: false # false => load Models/BimpeTTS/first_stage.pth
load_only_params: false
# DataLoader workers: 0 avoids Docker/VPS multiprocessing hangs
num_workers: 0

F0_path: "Utils/JDC/bst.t7"
ASR_config: "Utils/ASR/config.yml"
ASR_path: "Utils/ASR/epoch_00080.pth"
PLBERT_dir: "Utils/PLBERT/"

data_params:
  train_data: "/root/Data/train_list.txt"
  val_data: "/root/Data/val_list.txt"
  root_path: "/root/BimpeTTS_Dataset/wavs"
  OOD_data: "/root/Data/OOD_texts.txt"
  min_length: 50 # sample until OOD texts with this size are obtained

preprocess_params:
  sr: 24000
  spect_params:
    n_fft: 2048
    win_length: 1200
    hop_length: 300

model_params:
  multispeaker: false

  dim_in: 64
  hidden_dim: 512
  max_conv_dim: 512
  n_layer: 3
  n_mels: 80

  n_token: 178 # number of phoneme tokens
  max_dur: 50 # maximum duration of a single phoneme
  style_dim: 128 # style vector size

  dropout: 0.2

  # config for decoder (match stage-1 upstream)
  decoder:
    type: 'istftnet' # either hifigan or istftnet
    resblock_kernel_sizes: [3, 7, 11]
    upsample_rates: [10, 6]
    upsample_initial_channel: 512
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
    upsample_kernel_sizes: [20, 12]
    gen_istft_n_fft: 20
    gen_istft_hop_size: 5

  # speech language model config
  slm:
    model: "microsoft/wavlm-base-plus"
    sr: 16000 # sampling rate of SLM
    hidden: 768 # hidden size of SLM
    nlayers: 13 # number of layers of SLM
    initial_channel: 64 # initial channels of SLM discriminator head

  # style diffusion model config
  diffusion:
    embedding_mask_proba: 0.1
    transformer:
      num_layers: 3
      num_heads: 8
      head_features: 64
      multiplier: 2
    dist:
      sigma_data: 0.2
      estimate_sigma_data: true
      mean: -3.0
      std: 1.0

loss_params:
  lambda_mel: 5. # mel reconstruction loss
  lambda_gen: 1. # generator loss
  lambda_slm: 1. # slm feature matching loss

  lambda_mono: 1. # monotonic alignment loss (1st stage, TMA)
  lambda_s2s: 1. # sequence-to-sequence loss (1st stage, TMA)
  TMA_epoch: 50 # TMA starting epoch — keep >> 0 so early epochs are mel-only

  lambda_F0: 1.
  lambda_norm: 1.
  lambda_dur: 1.
  lambda_ce: 20.
  lambda_sty: 1.
  lambda_diff: 1.

  diff_epoch: 20
  joint_epoch: 50

optimizer_params:
  lr: 0.0001
  bert_lr: 0.00001
  ft_lr: 0.00001
  pct_start: 0.0

slmadv_params:
  min_len: 400
  max_len: 500
  batch_percentage: 0.5
  iter: 10
  thresh: 5
  scale: 0.01
  sig: 1.5
